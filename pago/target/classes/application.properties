spring.application.name=sakura_pago
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/sakura_pago?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

sakura.personas.url=http://localhost:8081
sakura.catalogo.url=http://localhost:8082
sakura.personal.url=http://localhost:8083
sakura.agenda.url=http://localhost:8084
sakura.pago.url=http://localhost:8085
sakura.inventario.url=http://localhost:8086
sakura.configuracion.url=http://localhost:8088

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha
